<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="RetailFlow POS"><title>RetailFlow POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head><body>
<div id="authScreen" class="auth-screen"><div class="auth-card">
<div class="brand auth-brand"><div class="brand-mark">RF</div><div><strong>RetailFlow</strong><span>Point of Sale</span></div></div>
<h1 id="authTitle">Welcome back</h1><p id="authSubtitle">Sign in to open your POS counter.</p>
<form id="authForm" class="auth-form"><label id="nameField" class="hidden">Full name<input id="authName" type="text" placeholder="Cashier name"></label>
<label>Email<input id="authEmail" type="email" placeholder="you@example.com" required></label>
<label>Password<input id="authPassword" type="password" placeholder="••••••••" minlength="6" required></label>
<button class="checkout-btn" type="submit" id="authSubmit">Sign in <span>→</span></button></form>
<button class="auth-switch" id="authSwitch" data-signup="1">Create a new account</button>
<div class="auth-note">POS data is protected by Supabase authentication and Row Level Security.</div>
<div id="authMessage" class="form-message"></div></div></div>
<div class="app-shell hidden" id="appShell"><aside class="sidebar" id="sidebar">
<div class="brand"><div class="brand-mark">RF</div><div><strong>RetailFlow</strong><span>Point of Sale</span></div></div>
<nav class="nav" id="nav"><button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button><button class="nav-item" data-view="sale"><span>▣</span> New Sale</button><button class="nav-item" data-view="products"><span>◫</span> Products</button><button class="nav-item" data-view="inventory"><span>▤</span> Inventory</button><button class="nav-item" data-view="customers"><span>◉</span> Customers</button><button class="nav-item" data-view="reports"><span>◔</span> Reports</button></nav>
<div class="sidebar-bottom"><div class="store-card"><div class="store-icon">₹</div><div><strong>City Mart</strong><span>Chittoor • Counter 01</span></div></div>
<button class="nav-item muted" data-view="settings"><span>⚙</span> Settings</button><div class="profile"><div class="avatar" id="profileAvatar">RF</div><div><strong id="profileName">Cashier</strong><span id="profileRole">Online</span></div><span class="online-dot"></span></div>
<button class="nav-item muted" id="signOutBtn"><span>↪</span> Sign out</button></div></aside>
<main class="main"><header class="topbar"><div class="topbar-left"><button class="mobile-menu" id="mobileMenu">☰</button><div><h1 id="pageTitle">Sales Dashboard</h1><p id="pageSubtitle">Today at a glance</p></div></div>
<div class="topbar-actions"><button class="icon-btn" id="refreshBtn">↻</button><button class="outline-btn" id="topNewSale">+ New Sale</button></div></header><div id="appView"></div></main></div>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="app.js"></script></body></html>
